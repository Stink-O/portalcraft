# Defaults for the Minecraft world (bridge #81). There is NO fixed seed and no hand-picked cliff:
#   * a player's first launch creates the save "Portalcraft" with a RANDOM seed (SecureRandom) and keeps it with the save; later launches reuse it;
#   * the mod (SpotFinder.java) finds the exit spot of a new world once (natural 2x3 vertical face with clear landing ground, else a built stone
#     backing), stores it in the save (portalcraft.json) and reports it in cache/bridge/portalcraft_world.env (KEY=VALUE: SEED SAVE CLIFF_X/Y/Z
#     CLIFF_DX/DZ EXIT_WX/WY/WZ CHAMBER_X/Y/Z SPOT_KIND SPOT_FACE_H). The plugin, play_clip.sh and the test scripts (@KEY@) read THAT report.
# Override for tests and filming: PORTALCRAFT_SEED=<n> tools/play_clip.sh ...  (the save is then Portalcraft_<n>, never the player's "Portalcraft").
# Plain KEY=VALUE (valid shell), read by tools/world_conf.sh and tools/world_conf.py.

RENDER_DISTANCE=24

# the seed the test runs (tools/locked_run.sh, focused_batch.sh) force when PORTALCRAFT_SEED is not set: the tests that were written for a specific
# terrain are tied to this seed (its save Portalcraft_<seed> is a throwaway; the player's own world is never used by a test run)
TEST_SEED=1777000111
